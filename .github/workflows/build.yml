name: Build ESA APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write project files
        run: |
          cat > settings.gradle <<'ESA_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ESA"
          include ':app'
          ESA_EOF
          cat > build.gradle <<'ESA_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          ESA_EOF
          cat > gradle.properties <<'ESA_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          ESA_EOF
          mkdir -p app
          cat > app/build.gradle <<'ESA_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.esa.busyreply'
              compileSdk 34
              defaultConfig {
                  applicationId "com.esa.busyreply"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
          }
          ESA_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'ESA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
              </queries>
              <application android:label="ESA" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".AssistantService" android:exported="false"
                      android:foregroundServiceType="microphone"/>
                  <service android:name=".MessageListener" android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService"/>
                      </intent-filter>
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          ESA_EOF
          mkdir -p app/src/main/java/com/esa/busyreply
          cat > app/src/main/java/com/esa/busyreply/MainActivity.kt <<'ESA_EOF'
          package com.esa.busyreply

          import android.Manifest
          import android.app.Activity
          import android.app.NotificationManager
          import android.app.TimePickerDialog
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.telephony.SubscriptionManager
          import android.provider.Settings
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private val BG = Color.parseColor("#0E1120")
              private val CARD = Color.parseColor("#181D35")
              private val FIELD = Color.parseColor("#10142A")
              private val ACC = Color.parseColor("#7C6CFF")
              private val ACC2 = Color.parseColor("#22D3C5")
              private val MUTED = Color.parseColor("#98A2C8")
              private val OK = Color.parseColor("#2ED573")
              private val BAD = Color.parseColor("#FF6B81")
              private val TXT = Color.WHITE
              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = BG
                  window.navigationBarColor = BG
                  getSystemService(NotificationManager::class.java).cancel(2)
                  if (intent.getBooleanExtra("autostart", false) && micOk() && AssistantService.instance == null) {
                      startForegroundService(Intent(this, AssistantService::class.java))
                  }
              }

              override fun onResume() {
                  super.onResume()
                  build()
              }

              override fun onRequestPermissionsResult(c: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(c, p, r)
                  build()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun bg(color: Int, r: Int = 20) = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(r).toFloat()
              }

              private fun micOk() =
                  checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED

              private fun listenerOn() =
                  Settings.Secure.getString(contentResolver, "enabled_notification_listeners")
                      ?.contains(packageName) == true

              private fun batteryOk() =
                  getSystemService(PowerManager::class.java).isIgnoringBatteryOptimizations(packageName)

              private fun askPerms() {
                  val list = mutableListOf(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33) list.add(Manifest.permission.POST_NOTIFICATIONS)
                  requestPermissions(list.toTypedArray(), 1)
              }

              private fun toggle() {
                  if (AssistantService.instance != null) {
                      stopService(Intent(this, AssistantService::class.java))
                  } else {
                      if (!micOk()) { askPerms(); return }
                      if (!listenerOn()) Toast.makeText(this, "Pehle Notification Access dein", Toast.LENGTH_LONG).show()
                      startForegroundService(Intent(this, AssistantService::class.java))
                  }
                  window.decorView.postDelayed({ build() }, 700)
              }

              private fun label(t: String, size: Float, color: Int, bold: Boolean = false) =
                  TextView(this).apply {
                      text = t
                      textSize = size
                      setTextColor(color)
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }

              private fun chip(t: String, soft: Boolean, onClick: () -> Unit): TextView =
                  TextView(this).apply {
                      text = t
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(dp(14), dp(7), dp(14), dp(7))
                      background = bg(if (soft) Color.parseColor("#2A3260") else ACC, 14)
                      setOnClickListener { onClick() }
                  }

              private fun card(title: String, sub: String, body: LinearLayout.() -> Unit): LinearLayout {
                  val c = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = bg(CARD)
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      layoutParams = LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(14) }
                  }
                  c.addView(label(title, 17f, TXT, true))
                  c.addView(label(sub, 12f, MUTED))
                  c.body()
                  return c
              }

              private fun statusRow(name: String, ok: Boolean, fix: () -> Unit): LinearLayout {
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(12), 0, 0)
                  }
                  r.addView(View(this).apply {
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(if (ok) OK else BAD)
                      }
                      layoutParams = LinearLayout.LayoutParams(dp(10), dp(10)).apply { rightMargin = dp(12) }
                  })
                  r.addView(label(name, 15f, TXT).apply {
                      layoutParams = LinearLayout.LayoutParams(0, WRAP, 1f)
                  })
                  r.addView(chip(if (ok) "Theek hai" else "Theek karein", ok) { if (!ok) fix() })
                  return r
              }

              private fun actionRow(name: String, btn: String, onClick: () -> Unit): LinearLayout {
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(12), 0, 0)
                  }
                  r.addView(View(this).apply {
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#FFB84D"))
                      }
                      layoutParams = LinearLayout.LayoutParams(dp(10), dp(10)).apply { rightMargin = dp(12) }
                  })
                  r.addView(label(name, 15f, TXT).apply {
                      layoutParams = LinearLayout.LayoutParams(0, WRAP, 1f)
                  })
                  r.addView(chip(btn, false) { onClick() })
                  return r
              }

              private fun openAutoStart() {
                  val m = (Build.MANUFACTURER + " " + Build.BRAND).lowercase()
                  val list = ArrayList<Pair<String, String>>()
                  if (m.contains("xiaomi") || m.contains("redmi") || m.contains("poco")) {
                      list.add("com.miui.securitycenter" to "com.miui.permcenter.autostart.AutoStartManagementActivity")
                  }
                  if (m.contains("oppo") || m.contains("realme") || m.contains("oneplus")) {
                      list.add("com.coloros.safecenter" to "com.coloros.safecenter.permission.startup.StartupAppListActivity")
                      list.add("com.coloros.safecenter" to "com.coloros.safecenter.startupapp.StartupAppListActivity")
                      list.add("com.oppo.safe" to "com.oppo.safe.permission.startup.StartupAppListActivity")
                  }
                  if (m.contains("vivo") || m.contains("iqoo")) {
                      list.add("com.vivo.permissionmanager" to "com.vivo.permissionmanager.activity.BgStartUpManagerActivity")
                      list.add("com.iqoo.secure" to "com.iqoo.secure.ui.phoneoptimize.AddWhiteListActivity")
                  }
                  if (m.contains("huawei") || m.contains("honor")) {
                      list.add("com.huawei.systemmanager" to "com.huawei.systemmanager.startupmgr.ui.StartupNormalAppListActivity")
                      list.add("com.huawei.systemmanager" to "com.huawei.systemmanager.optimize.process.ProtectActivity")
                  }
                  if (m.contains("samsung")) {
                      list.add("com.samsung.android.lool" to "com.samsung.android.sm.battery.ui.BatteryActivity")
                      list.add("com.samsung.android.lool" to "com.samsung.android.sm.ui.battery.BatteryActivity")
                  }
                  if (m.contains("asus")) {
                      list.add("com.asus.mobilemanager" to "com.asus.mobilemanager.powersaver.PowerSaverSettings")
                  }
                  for ((pkg, cls) in list) {
                      try {
                          startActivity(Intent().setComponent(ComponentName(pkg, cls)))
                          Toast.makeText(this, "Yahan ESA ko allow / ON karein", Toast.LENGTH_LONG).show()
                          return
                      } catch (e: Exception) {
                      }
                  }
                  startActivity(
                      Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS)
                          .setData(Uri.parse("package:" + packageName))
                  )
                  Toast.makeText(this, "Yahan Battery ya Auto-start dhoondh kar allow karein", Toast.LENGTH_LONG).show()
              }

              private fun askSimPerms() {
                  requestPermissions(
                      arrayOf(
                          Manifest.permission.SEND_SMS,
                          Manifest.permission.READ_PHONE_STATE,
                          Manifest.permission.READ_CONTACTS
                      ), 2
                  )
              }

              private fun simInfo(): String {
                  if (checkSelfPermission(Manifest.permission.READ_PHONE_STATE) != PackageManager.PERMISSION_GRANTED) return ""
                  return try {
                      val subs = getSystemService(SubscriptionManager::class.java).activeSubscriptionInfoList
                          ?: return ""
                      subs.sortedBy { it.simSlotIndex }
                          .joinToString("   ") { "SIM " + (it.simSlotIndex + 1) + ": " + it.displayName }
                  } catch (e: Exception) {
                      ""
                  }
              }

              private fun switchRow(title: String, sub: String, key: String, def: Boolean): LinearLayout {
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(14), 0, 0)
                  }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, WRAP, 1f)
                      setPadding(0, 0, dp(12), 0)
                  }
                  col.addView(label(title, 15f, TXT))
                  col.addView(label(sub, 12f, MUTED))
                  val sw = Switch(this).apply {
                      isChecked = Prefs.bool(this@MainActivity, key, def)
                      trackTintList = ColorStateList(
                          arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()),
                          intArrayOf(ACC, Color.parseColor("#39406A"))
                      )
                      thumbTintList = ColorStateList.valueOf(Color.WHITE)
                      setOnCheckedChangeListener { _, v -> Prefs.setBool(this@MainActivity, key, v) }
                  }
                  r.addView(col)
                  r.addView(sw)
                  return r
              }

              private fun field(ph: String, value: String, onChange: (String) -> Unit): EditText =
                  EditText(this).apply {
                      setText(value)
                      hint = ph
                      setTextColor(TXT)
                      setHintTextColor(MUTED)
                      textSize = 14f
                      background = bg(FIELD, 12)
                      setPadding(dp(12), dp(10), dp(12), dp(10))
                      layoutParams = LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(6) }
                      addTextChangedListener(object : TextWatcher {
                          override fun afterTextChanged(s: Editable?) { onChange(s?.toString() ?: "") }
                          override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                          override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      })
                  }

              private fun fmt(m: Int): String {
                  val h = m / 60
                  val mm = m % 60
                  val ap = if (h < 12) "AM" else "PM"
                  val h12 = if (h % 12 == 0) 12 else h % 12
                  return h12.toString() + ":" + (if (mm < 10) "0" else "") + mm + " " + ap
              }

              private fun timeChip(key: String, def: Int): TextView {
                  val m = Prefs.int(this, key, def)
                  return chip(fmt(m), false) {
                      TimePickerDialog(this, { _, h, mm ->
                          Prefs.setInt(this, key, h * 60 + mm)
                          build()
                      }, m / 60, m % 60, false).show()
                  }
              }

              private fun build() {
                  val on = AssistantService.instance != null
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(36), dp(16), dp(32))
                  }
                  root.addView(label("ESA", 32f, TXT, true))
                  root.addView(label("Aapka voice busy-reply assistant", 14f, MUTED))

                  val power = TextView(this).apply {
                      text = if (on) "ON" else "OFF"
                      textSize = 30f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      val c1 = if (on) ACC else Color.parseColor("#2A3050")
                      val c2 = if (on) ACC2 else Color.parseColor("#1F2440")
                      background = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(c1, c2)).apply {
                          shape = GradientDrawable.OVAL
                          setStroke(dp(4), if (on) ACC2 else Color.parseColor("#39406A"))
                      }
                      layoutParams = LinearLayout.LayoutParams(dp(150), dp(150)).apply {
                          gravity = Gravity.CENTER_HORIZONTAL
                          topMargin = dp(22)
                          bottomMargin = dp(10)
                      }
                      setOnClickListener { toggle() }
                  }
                  root.addView(power)
                  val n = Prefs.int(this, "count", 0)
                  root.addView(label(
                      (if (on) "Chal raha hai" else "Band hai - dabayen shuru karne ke liye") +
                          "  |  Ab tak " + n + " replies", 13f, MUTED
                  ).apply { gravity = Gravity.CENTER_HORIZONTAL })

                  root.addView(card("Setup", "Ye teen cheezein theek honi chahiye") {
                      addView(statusRow("Notification Access", listenerOn()) {
                          startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                      })
                      addView(statusRow("Mic aur Notification permission", micOk()) { askPerms() })
                      addView(statusRow("Battery restriction hatayen", batteryOk()) {
                          startActivity(
                              Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                                  .setData(Uri.parse("package:" + packageName))
                          )
                      })
                      addView(actionRow("Auto-start / Background allow karein", "Kholein") { openAutoStart() })
                  })

                  root.addView(card("Smart features", "Apne hisaab se on/off karein") {
                      addView(switchRow("Game mode", "Bolne ki zaroorat nahi, khud 'game' wala reply bhej de", "game", false))
                      addView(switchRow("Groups ignore karein", "WhatsApp groups ke message na bole", "nogroups", true))
                      addView(switchRow("Urdu awaz", "Urdu bol kar bhi hukm dein (jaise 'mashroof')", "urdu", false))
                      addView(switchRow("Restart ke baad yaad dilaye", "Phone on hone par ESA shuru karne ki notification aaye", "autostart", true))
                      addView(switchRow("Quiet hours", "In ghanto mein bolti nahi, chup chaap 'sleeping' reply bhejti hai", "quiet", false))
                      val tr = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(0, dp(10), 0, 0)
                      }
                      tr.addView(label("Se  ", 13f, MUTED))
                      tr.addView(timeChip("qs", 23 * 60))
                      tr.addView(label("   tak  ", 13f, MUTED))
                      tr.addView(timeChip("qe", 7 * 60))
                      addView(tr)
                  })

                  root.addView(card("SMS reply kis SIM se", "Sirf local SMS ke liye. WhatsApp par asar nahi") {
                      val cur = Prefs.int(this@MainActivity, "sim", 0)
                      val row = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          setPadding(0, dp(14), 0, 0)
                      }
                      val names = listOf("Auto", "SIM 1", "SIM 2")
                      for (i in 0..2) {
                          val c = chip(names[i], i != cur) {
                              Prefs.setInt(this@MainActivity, "sim", i)
                              if (i != 0) askSimPerms()
                              build()
                          }
                          c.layoutParams = LinearLayout.LayoutParams(WRAP, WRAP).apply { rightMargin = dp(10) }
                          row.addView(c)
                      }
                      addView(row)
                      val info = simInfo()
                      if (info.isNotEmpty()) {
                          addView(label(info, 12f, MUTED).apply { setPadding(0, dp(10), 0, 0) })
                      }
                      addView(label(
                          "Auto: jis SIM par message aaya usi se reply jata hai (messaging app ka default). SIM 1 / SIM 2 chunne par SMS Contacts, Phone aur SMS ki permission se seedha us SIM se jayega.",
                          12f, MUTED
                      ).apply { setPadding(0, dp(10), 0, 0) })
                  })

                  root.addView(card("Sirf chune hue log", "Khali chorein to sab ke message. Naam comma se alag karein") {
                      addView(field("Jaise: Ali, Ammi, Boss", Prefs.str(this@MainActivity, "contacts", "")) {
                          Prefs.setStr(this@MainActivity, "contacts", it)
                      })
                  })

                  root.addView(card("Reply messages", "Apne hisaab se badlein") {
                      for ((k, nm) in Prefs.labels) {
                          addView(label(nm, 13f, MUTED).apply { setPadding(0, dp(12), 0, 0) })
                          addView(field("Reply likhein", Prefs.reply(this@MainActivity, k)) {
                              Prefs.setStr(this@MainActivity, "r_" + k, it)
                          })
                      }
                      addView(label(
                          "Tip: aap jo bhi bolen wahi reply ban kar chala jata hai. Sirf chhota lafz (busy, game, driving, meeting, sleeping, namaz) bolen to upar likha hua reply jata hai.",
                          12f, MUTED
                      ).apply { setPadding(0, dp(14), 0, 0) })
                  })

                  val log = Prefs.log(this)
                  root.addView(card("Activity log", "Kis ko kya reply gaya") {
                      if (log.isEmpty()) {
                          addView(label("Abhi tak koi activity nahi.", 13f, MUTED).apply { setPadding(0, dp(12), 0, 0) })
                      }
                      for (l in log) {
                          addView(label(l, 12f, TXT).apply { setPadding(0, dp(10), 0, 0) })
                      }
                      if (log.isNotEmpty()) {
                          val clear = chip("Log saaf karein", true) {
                              Prefs.setStr(this@MainActivity, "log", "")
                              build()
                          }
                          clear.layoutParams = LinearLayout.LayoutParams(WRAP, WRAP).apply { topMargin = dp(14) }
                          addView(clear)
                      }
                  })

                  val sv = ScrollView(this).apply {
                      setBackgroundColor(BG)
                      isFillViewport = true
                      addView(root)
                  }
                  setContentView(sv)
              }
          }
          ESA_EOF
          mkdir -p app/src/main/java/com/esa/busyreply
          cat > app/src/main/java/com/esa/busyreply/MessageListener.kt <<'ESA_EOF'
          package com.esa.busyreply

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class MessageListener : NotificationListenerService() {
              private val seen = LinkedHashSet<String>()
              private val packages = setOf(
                  "com.whatsapp", "com.whatsapp.w4b",
                  "com.google.android.apps.messaging", "com.samsung.android.messaging",
                  "com.android.mms", "com.android.messaging"
              )

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val svc = AssistantService.instance ?: return
                  if (sbn.packageName !in packages) return
                  val n = sbn.notification
                  if (n.flags and Notification.FLAG_GROUP_SUMMARY != 0) return
                  val ex = n.extras
                  val title = ex.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: return
                  val text = ex.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: return
                  if (title == "WhatsApp" || Regex("\\d+ (new )?messages").containsMatchIn(text)) return

                  val isGroup = ex.getBoolean(Notification.EXTRA_IS_GROUP_CONVERSATION) ||
                      ex.getCharSequence(Notification.EXTRA_CONVERSATION_TITLE) != null
                  if (Prefs.bool(this, "nogroups", true) && isGroup) return

                  val only = Prefs.str(this, "contacts", "").split(",")
                      .map { it.trim().lowercase() }.filter { it.isNotEmpty() }
                  if (only.isNotEmpty() && only.none { title.lowercase().contains(it) }) return

                  if (svc.isOwn(text)) return
                  if (!seen.add(sbn.key + "|" + text)) return
                  if (seen.size > 100) seen.remove(seen.first())

                  var action: Notification.Action? =
                      n.actions?.firstOrNull { it.remoteInputs?.isNotEmpty() == true }
                  if (action == null) {
                      action = Notification.WearableExtender(n).actions
                          .firstOrNull { it.remoteInputs?.isNotEmpty() == true }
                  }
                  val a = action ?: return
                  svc.enqueue(Pending(title, text, a.remoteInputs, a.actionIntent, sbn.packageName))
              }
          }
          ESA_EOF
          mkdir -p app/src/main/java/com/esa/busyreply
          cat > app/src/main/java/com/esa/busyreply/AssistantService.kt <<'ESA_EOF'
          package com.esa.busyreply

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.RemoteInput
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.Manifest
          import android.content.pm.PackageManager
          import android.provider.ContactsContract
          import android.telephony.SmsManager
          import android.telephony.SubscriptionManager
          import java.util.Calendar
          import java.util.Locale

          class Pending(
              val sender: String,
              val text: String,
              val inputs: Array<RemoteInput>,
              val intent: PendingIntent,
              val pkg: String
          )

          class AssistantService : Service(), TextToSpeech.OnInitListener {
              private lateinit var tts: TextToSpeech
              private var ttsReady = false
              private val handler = Handler(Looper.getMainLooper())
              private val queue = ArrayDeque<Pending>()
              private var working = false
              private var current: Pending? = null
              private var recognizer: SpeechRecognizer? = null
              private var deadline = 0L
              private var readOnly = false
              private val lastReply = HashMap<String, Long>()
              private val sent = ArrayList<String>()

              private val keys = listOf(
                  "busy" to listOf("busy", "bizzy", "mashroof", "مصروف"),
                  "game" to listOf("game", "gaming", "گیم"),
                  "driving" to listOf("driving", "drive", "ڈرائیو"),
                  "meeting" to listOf("meeting", "میٹنگ"),
                  "sleeping" to listOf("sleep", "sleeping", "نیند", "سو رہا"),
                  "namaz" to listOf("namaz", "prayer", "نماز")
              )

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("esa", "ESA", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, "esa")
                      .setContentTitle("ESA chal raha hai")
                      .setContentText("Messages ka intezar hai")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 30) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
                  tts = TextToSpeech(this, this)
              }

              override fun onInit(status: Int) {
                  ttsReady = status == TextToSpeech.SUCCESS
                  if (!ttsReady) return
                  tts.language = Locale.getDefault()
                  tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) {}
                      override fun onDone(id: String?) { handler.post { spoken(id) } }
                      @Deprecated("Deprecated in Java")
                      override fun onError(id: String?) { handler.post { spoken(id) } }
                  })
                  handler.post { next() }
              }

              fun isOwn(t: String): Boolean = sent.any { t.contains(it) }

              fun enqueue(p: Pending) {
                  handler.post { queue.addLast(p); next() }
              }

              private fun inQuiet(): Boolean {
                  if (!Prefs.bool(this, "quiet", false)) return false
                  val c = Calendar.getInstance()
                  val now = c.get(Calendar.HOUR_OF_DAY) * 60 + c.get(Calendar.MINUTE)
                  val s = Prefs.int(this, "qs", 23 * 60)
                  val e = Prefs.int(this, "qe", 7 * 60)
                  return if (s <= e) (now >= s && now < e) else (now >= s || now < e)
              }

              private fun next() {
                  if (working || !ttsReady) return
                  val p = queue.removeFirstOrNull() ?: return
                  working = true
                  current = p
                  readOnly = false
                  val recent = System.currentTimeMillis() - (lastReply[p.sender] ?: 0L) < 10 * 60 * 1000L
                  if (inQuiet()) {
                      if (recent) skip(p) else autoReply(p, Prefs.reply(this, "sleeping"), "Quiet hours")
                  } else if (Prefs.bool(this, "game", false)) {
                      if (recent) skip(p) else autoReply(p, Prefs.reply(this, "game"), "Game mode")
                  } else {
                      readOnly = recent
                      say(p.sender + " ka message aaya hai. " + p.text, "msg")
                  }
              }

              private fun skip(p: Pending) {
                  Prefs.addLog(this, p.sender + "  -  dobara reply nahi bheja")
                  finish()
              }

              private fun autoReply(p: Pending, text: String, tag: String) {
                  sendReply(p, text, tag)
                  finish()
              }

              private fun say(t: String, id: String) {
                  tts.speak(t, TextToSpeech.QUEUE_FLUSH, null, id)
              }

              private fun spoken(id: String?) {
                  val p = current ?: return
                  if (id == "msg") {
                      if (readOnly) { finish(); return }
                      handler.postDelayed({
                          if (!SpeechRecognizer.isRecognitionAvailable(this)) finish()
                          else {
                              deadline = System.currentTimeMillis() + 60000
                              listen(p)
                          }
                      }, 400)
                  } else if (id == "ack") {
                      finish()
                  }
              }

              private fun listen(p: Pending) {
                  recognizer?.destroy()
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(res: Bundle?) {
                          val list = res?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION) ?: arrayListOf()
                          heard(p, list)
                      }
                      override fun onError(e: Int) { retryOrFinish(p) }
                      override fun onReadyForSpeech(b: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(b: Bundle?) {}
                      override fun onEvent(t: Int, b: Bundle?) {}
                  })
                  val lang = if (Prefs.bool(this, "urdu", false)) "ur-PK" else "en-IN"
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang)
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                      putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 2500L)
                  }
                  r.startListening(i)
              }

              private fun retryOrFinish(p: Pending) {
                  if (System.currentTimeMillis() < deadline - 3000) {
                      handler.postDelayed({ if (current === p) listen(p) }, 300)
                  } else finish()
              }

              private fun heard(p: Pending, results: List<String>) {
                  val first = (results.firstOrNull() ?: "").trim()
                  if (first.isEmpty()) { retryOrFinish(p); return }
                  var said = first
                  if (said.lowercase().startsWith("reply")) {
                      said = said.substring(5).trim().trimStart(':', ',', '-').trim()
                  }
                  if (said.isEmpty()) { retryOrFinish(p); return }
                  var reply = said
                  var tag = "Voice"
                  if (said.split(" ").size <= 3) {
                      val low = said.lowercase()
                      for ((k, words) in keys) {
                          if (words.any { it in low }) {
                              reply = Prefs.reply(this, k)
                              tag = Prefs.labels[k] ?: k
                              break
                          }
                      }
                  }
                  if (sendReply(p, reply, tag)) say("Reply bhej diya", "ack") else finish()
              }

              private fun sendReply(p: Pending, text: String, tag: String): Boolean {
                  val intent = Intent()
                  val bundle = Bundle()
                  for (ri in p.inputs) bundle.putCharSequence(ri.resultKey, text)
                  RemoteInput.addResultsToIntent(p.inputs, intent, bundle)
                  return try {
                      if (!(isSms(p) && sendSmsViaSim(p, text))) p.intent.send(this, 0, intent)
                      lastReply[p.sender] = System.currentTimeMillis()
                      sent.add(text)
                      if (sent.size > 20) sent.removeAt(0)
                      Prefs.setInt(this, "count", Prefs.int(this, "count", 0) + 1)
                      Prefs.addLog(this, p.sender + "  >  " + tag + ": " + text)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun isSms(p: Pending) = !p.pkg.startsWith("com.whatsapp")

              private fun sendSmsViaSim(p: Pending, text: String): Boolean {
                  val pref = Prefs.int(this, "sim", 0)
                  if (pref == 0) return false
                  if (checkSelfPermission(Manifest.permission.SEND_SMS) != PackageManager.PERMISSION_GRANTED) return false
                  if (checkSelfPermission(Manifest.permission.READ_PHONE_STATE) != PackageManager.PERMISSION_GRANTED) return false
                  val number = findNumber(p.sender) ?: return false
                  return try {
                      val subs = getSystemService(SubscriptionManager::class.java).activeSubscriptionInfoList
                          ?: return false
                      val sub = subs.firstOrNull { it.simSlotIndex == pref - 1 } ?: return false
                      val mgr = SmsManager.getSmsManagerForSubscriptionId(sub.subscriptionId)
                      mgr.sendMultipartTextMessage(number, null, mgr.divideMessage(text), null, null)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun findNumber(name: String): String? {
                  val digits = name.replace(Regex("[\\s\\-()]"), "")
                  if (Regex("\\+?\\d{6,15}").matches(digits)) return digits
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) return null
                  return try {
                      contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(ContactsContract.CommonDataKinds.Phone.NUMBER),
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " = ?",
                          arrayOf(name), null
                      )?.use { c -> if (c.moveToFirst()) c.getString(0) else null }
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun finish() {
                  recognizer?.destroy()
                  recognizer = null
                  current = null
                  working = false
                  next()
              }

              override fun onStartCommand(i: Intent?, f: Int, s: Int) = START_STICKY
              override fun onBind(i: Intent?): IBinder? = null

              override fun onDestroy() {
                  instance = null
                  recognizer?.destroy()
                  if (ttsReady) tts.shutdown()
                  super.onDestroy()
              }

              companion object {
                  @Volatile var instance: AssistantService? = null
              }
          }
          ESA_EOF
          mkdir -p app/src/main/java/com/esa/busyreply
          cat > app/src/main/java/com/esa/busyreply/Prefs.kt <<'ESA_EOF'
          package com.esa.busyreply

          import android.content.Context
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object Prefs {
              val defaults = linkedMapOf(
                  "busy" to "Abhi main busy hoon, baad mein baat karta hoon.",
                  "game" to "Main game khel raha hoon, baad mein baat karta hoon.",
                  "driving" to "Main drive kar raha hoon, baad mein baat karta hoon.",
                  "meeting" to "Main meeting mein hoon, baad mein baat karta hoon.",
                  "sleeping" to "Main so raha hoon, subah baat karta hoon.",
                  "namaz" to "Main namaz parh raha hoon, baad mein baat karta hoon."
              )
              val labels = linkedMapOf(
                  "busy" to "Busy", "game" to "Game", "driving" to "Driving",
                  "meeting" to "Meeting", "sleeping" to "Sleeping / Quiet hours", "namaz" to "Namaz"
              )

              private fun sp(c: Context) = c.getSharedPreferences("esa", Context.MODE_PRIVATE)
              fun bool(c: Context, k: String, d: Boolean) = sp(c).getBoolean(k, d)
              fun setBool(c: Context, k: String, v: Boolean) = sp(c).edit().putBoolean(k, v).apply()
              fun str(c: Context, k: String, d: String): String = sp(c).getString(k, d) ?: d
              fun setStr(c: Context, k: String, v: String) = sp(c).edit().putString(k, v).apply()
              fun int(c: Context, k: String, d: Int) = sp(c).getInt(k, d)
              fun setInt(c: Context, k: String, v: Int) = sp(c).edit().putInt(k, v).apply()
              fun reply(c: Context, k: String): String = str(c, "r_" + k, defaults[k] ?: "")

              fun log(c: Context): List<String> = str(c, "log", "").split("\n").filter { it.isNotBlank() }

              fun addLog(c: Context, line: String) {
                  val t = SimpleDateFormat("dd MMM, hh:mm a", Locale.getDefault()).format(Date())
                  val all = (listOf(t + "  |  " + line.replace("\n", " ")) + log(c)).take(40)
                  setStr(c, "log", all.joinToString("\n"))
              }
          }
          ESA_EOF
          mkdir -p app/src/main/java/com/esa/busyreply
          cat > app/src/main/java/com/esa/busyreply/BootReceiver.kt <<'ESA_EOF'
          package com.esa.busyreply

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  if (i.action != Intent.ACTION_BOOT_COMPLETED) return
                  if (!Prefs.bool(c, "autostart", true)) return
                  val nm = c.getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("esa_boot", "ESA shuru karein", NotificationManager.IMPORTANCE_HIGH)
                  )
                  val open = Intent(c, MainActivity::class.java)
                      .putExtra("autostart", true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val pi = PendingIntent.getActivity(
                      c, 0, open, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = Notification.Builder(c, "esa_boot")
                      .setContentTitle("ESA band hai")
                      .setContentText("Shuru karne ke liye yahan tap karein")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .build()
                  nm.notify(2, n)
              }
          }
          ESA_EOF
