name: Build Dock APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write project files
        run: |
          cat > settings.gradle <<'DOCK_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Dock"
          include ':app'
          DOCK_EOF
          cat > build.gradle <<'DOCK_EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          DOCK_EOF
          cat > gradle.properties <<'DOCK_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          DOCK_EOF
          mkdir -p app
          cat > app/build.gradle <<'DOCK_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.dock.app'
              compileSdk 35
              defaultConfig {
                  applicationId "com.dock.app"
                  minSdk 26
                  targetSdk 35
                  versionCode 20
                  versionName "3.7"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
          }
          DOCK_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'DOCK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
              </queries>
              <application android:label="Dock" android:icon="@drawable/ic_dock" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".AssistantService" android:exported="false"
                      android:foregroundServiceType="microphone"/>
                  <service android:name=".MessageListener" android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService"/>
                      </intent-filter>
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          DOCK_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_dock.xml <<'DOCK_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#000000" android:pathData="M54,80C30,62 20,50 20,38C20,28 28,22 36,22C43,22 50,27 54,33C58,27 65,22 72,22C80,22 88,28 88,38C88,50 78,62 54,80Z"/>
          </vector>
          DOCK_EOF
          mkdir -p app/src/main/java/com/dock/app
          cat > app/src/main/java/com/dock/app/MainActivity.kt <<'DOCK_EOF'
          package com.dock.app

          import android.Manifest
          import android.app.Activity
          import android.animation.ObjectAnimator
          import android.app.AlertDialog
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.TimePickerDialog
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.telephony.SubscriptionManager
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.MotionEvent
          import android.view.ViewGroup
          import android.view.animation.DecelerateInterpolator
          import android.view.animation.OvershootInterpolator
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private val BG = Color.parseColor("#000000")
              private val CARD = Color.parseColor("#141414")
              private val FIELD = Color.parseColor("#0A0A0A")
              private val ACC = Color.parseColor("#7C6CFF")
              private val ACC2 = Color.parseColor("#22D3C5")
              private val MUTED = Color.parseColor("#98A2C8")
              private val OK = Color.parseColor("#2ED573")
              private val BAD = Color.parseColor("#FF6B81")
              private val TXT = Color.WHITE
              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
              private var pulse: ObjectAnimator? = null
              private var introPlayed = false
              private var animateCards = false
              private var cardIdx = 0

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = BG
                  window.navigationBarColor = BG
                  getSystemService(NotificationManager::class.java).cancel(2)
                  Prefs.createAlertChannel(this)
                  if (intent.getBooleanExtra("autostart", false) && micOk() && AssistantService.instance == null) {
                      startForegroundService(Intent(this, AssistantService::class.java))
                  }
              }

              override fun onPause() {
                  super.onPause()
                  pulse?.cancel()
              }

              override fun onResume() {
                  super.onResume()
                  build()
              }

              override fun onRequestPermissionsResult(c: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(c, p, r)
                  build()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun bg(color: Int, r: Int = 20) = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(r).toFloat()
              }

              private fun micOk() =
                  checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED

              private fun listenerOn() =
                  Settings.Secure.getString(contentResolver, "enabled_notification_listeners")
                      ?.contains(packageName) == true

              private fun batteryOk() =
                  getSystemService(PowerManager::class.java).isIgnoringBatteryOptimizations(packageName)

              private fun askPerms() {
                  val list = mutableListOf(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33) list.add(Manifest.permission.POST_NOTIFICATIONS)
                  requestPermissions(list.toTypedArray(), 1)
              }

              private fun toggle() {
                  if (AssistantService.instance != null) {
                      stopService(Intent(this, AssistantService::class.java))
                  } else {
                      if (!micOk()) { askPerms(); return }
                      if (!listenerOn()) Toast.makeText(this, "Pehle Notification Access dein", Toast.LENGTH_LONG).show()
                      startForegroundService(Intent(this, AssistantService::class.java))
                  }
                  window.decorView.postDelayed({ build() }, 700)
              }

              private fun label(t: String, size: Float, color: Int, bold: Boolean = false) =
                  TextView(this).apply {
                      text = t
                      textSize = size
                      setTextColor(color)
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }

              // 3D press effect: the view tilts and shrinks on touch, then springs back.
              private fun pressFx(v: View, action: Int) {
                  when (action) {
                      MotionEvent.ACTION_DOWN -> {
                          v.cameraDistance = 12000f * resources.displayMetrics.density
                          v.animate().scaleX(0.92f).scaleY(0.92f).rotationX(10f).setDuration(110).start()
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          v.animate().scaleX(1f).scaleY(1f).rotationX(0f)
                              .setDuration(260).setInterpolator(OvershootInterpolator()).start()
                      }
                  }
              }

              private fun chip(t: String, soft: Boolean, onClick: () -> Unit): TextView =
                  TextView(this).apply {
                      text = t
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(dp(14), dp(7), dp(14), dp(7))
                      background = bg(if (soft) Color.parseColor("#2A3260") else ACC, 14)
                      elevation = dp(4).toFloat()
                      setOnTouchListener { v, e -> pressFx(v, e.action); false }
                      setOnClickListener { onClick() }
                  }

              private fun card(title: String, sub: String, body: LinearLayout.() -> Unit): LinearLayout {
                  val c = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = bg(CARD)
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      layoutParams = LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(14) }
                  }
                  c.addView(label(title, 17f, TXT, true))
                  c.addView(label(sub, 12f, MUTED))
                  c.body()
                  c.elevation = dp(6).toFloat()
                  if (animateCards) {
                      c.cameraDistance = 12000f * resources.displayMetrics.density
                      c.alpha = 0f
                      c.translationY = dp(36).toFloat()
                      c.rotationX = 14f
                      c.animate().alpha(1f).translationY(0f).rotationX(0f)
                          .setStartDelay(cardIdx++ * 70L).setDuration(520)
                          .setInterpolator(DecelerateInterpolator()).start()
                  }
                  return c
              }

              private fun statusRow(name: String, ok: Boolean, fix: () -> Unit): LinearLayout {
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(12), 0, 0)
                  }
                  r.addView(View(this).apply {
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(if (ok) OK else BAD)
                      }
                      layoutParams = LinearLayout.LayoutParams(dp(10), dp(10)).apply { rightMargin = dp(12) }
                  })
                  r.addView(label(name, 15f, TXT).apply {
                      layoutParams = LinearLayout.LayoutParams(0, WRAP, 1f)
                  })
                  r.addView(chip(if (ok) "Theek hai" else "Theek karein", ok) { if (!ok) fix() })
                  return r
              }

              private fun actionRow(name: String, btn: String, onClick: () -> Unit): LinearLayout {
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(12), 0, 0)
                  }
                  r.addView(View(this).apply {
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#FFB84D"))
                      }
                      layoutParams = LinearLayout.LayoutParams(dp(10), dp(10)).apply { rightMargin = dp(12) }
                  })
                  r.addView(label(name, 15f, TXT).apply {
                      layoutParams = LinearLayout.LayoutParams(0, WRAP, 1f)
                  })
                  r.addView(chip(btn, false) { onClick() })
                  return r
              }

              private fun openAutoStart() {
                  val m = (Build.MANUFACTURER + " " + Build.BRAND).lowercase()
                  val list = ArrayList<Pair<String, String>>()
                  if (m.contains("xiaomi") || m.contains("redmi") || m.contains("poco")) {
                      list.add("com.miui.securitycenter" to "com.miui.permcenter.autostart.AutoStartManagementActivity")
                  }
                  if (m.contains("oppo") || m.contains("realme") || m.contains("oneplus")) {
                      list.add("com.coloros.safecenter" to "com.coloros.safecenter.permission.startup.StartupAppListActivity")
                      list.add("com.coloros.safecenter" to "com.coloros.safecenter.startupapp.StartupAppListActivity")
                      list.add("com.oppo.safe" to "com.oppo.safe.permission.startup.StartupAppListActivity")
                  }
                  if (m.contains("vivo") || m.contains("iqoo")) {
                      list.add("com.vivo.permissionmanager" to "com.vivo.permissionmanager.activity.BgStartUpManagerActivity")
                      list.add("com.iqoo.secure" to "com.iqoo.secure.ui.phoneoptimize.AddWhiteListActivity")
                  }
                  if (m.contains("huawei") || m.contains("honor")) {
                      list.add("com.huawei.systemmanager" to "com.huawei.systemmanager.startupmgr.ui.StartupNormalAppListActivity")
                      list.add("com.huawei.systemmanager" to "com.huawei.systemmanager.optimize.process.ProtectActivity")
                  }
                  if (m.contains("samsung")) {
                      list.add("com.samsung.android.lool" to "com.samsung.android.sm.battery.ui.BatteryActivity")
                      list.add("com.samsung.android.lool" to "com.samsung.android.sm.ui.battery.BatteryActivity")
                  }
                  if (m.contains("asus")) {
                      list.add("com.asus.mobilemanager" to "com.asus.mobilemanager.powersaver.PowerSaverSettings")
                  }
                  for ((pkg, cls) in list) {
                      try {
                          startActivity(Intent().setComponent(ComponentName(pkg, cls)))
                          Toast.makeText(this, "Yahan " + Prefs.name(this) + " ko allow / ON karein", Toast.LENGTH_LONG).show()
                          return
                      } catch (e: Exception) {
                      }
                  }
                  startActivity(
                      Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS)
                          .setData(Uri.parse("package:" + packageName))
                  )
                  Toast.makeText(this, "Yahan Battery ya Auto-start dhoondh kar allow karein", Toast.LENGTH_LONG).show()
              }

              private fun askSimPerms() {
                  requestPermissions(
                      arrayOf(
                          Manifest.permission.SEND_SMS,
                          Manifest.permission.READ_PHONE_STATE,
                          Manifest.permission.READ_CONTACTS
                      ), 2
                  )
              }

              private fun simInfo(): String {
                  if (checkSelfPermission(Manifest.permission.READ_PHONE_STATE) != PackageManager.PERMISSION_GRANTED) return ""
                  return try {
                      val subs = getSystemService(SubscriptionManager::class.java).activeSubscriptionInfoList
                          ?: return ""
                      subs.sortedBy { it.simSlotIndex }
                          .joinToString("   ") { "SIM " + (it.simSlotIndex + 1) + ": " + it.displayName }
                  } catch (e: Exception) {
                      ""
                  }
              }

              private fun switchRow(title: String, sub: String, key: String, def: Boolean): LinearLayout {
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(14), 0, 0)
                  }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, WRAP, 1f)
                      setPadding(0, 0, dp(12), 0)
                  }
                  col.addView(label(title, 15f, TXT))
                  col.addView(label(sub, 12f, MUTED))
                  val sw = Switch(this).apply {
                      isChecked = Prefs.bool(this@MainActivity, key, def)
                      trackTintList = ColorStateList(
                          arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()),
                          intArrayOf(ACC, Color.parseColor("#39406A"))
                      )
                      thumbTintList = ColorStateList.valueOf(Color.WHITE)
                      setOnCheckedChangeListener { _, v -> Prefs.setBool(this@MainActivity, key, v) }
                  }
                  r.addView(col)
                  r.addView(sw)
                  return r
              }

              private fun field(ph: String, value: String, onChange: (String) -> Unit): EditText =
                  EditText(this).apply {
                      setText(value)
                      hint = ph
                      setTextColor(TXT)
                      setHintTextColor(MUTED)
                      textSize = 14f
                      background = bg(FIELD, 12)
                      setPadding(dp(12), dp(10), dp(12), dp(10))
                      layoutParams = LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(6) }
                      addTextChangedListener(object : TextWatcher {
                          override fun afterTextChanged(s: Editable?) { onChange(s?.toString() ?: "") }
                          override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                          override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      })
                  }

              private fun seek(key: String, lo: Int, hi: Int, def: Int) = SeekBar(this).apply {
                  max = hi - lo
                  progress = Prefs.int(this@MainActivity, key, def) - lo
                  layoutParams = LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(4) }
                  setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) {
                          Prefs.setInt(this@MainActivity, key, p + lo)
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
              }

              private fun fmt(m: Int): String {
                  val h = m / 60
                  val mm = m % 60
                  val ap = if (h < 12) "AM" else "PM"
                  val h12 = if (h % 12 == 0) 12 else h % 12
                  return h12.toString() + ":" + (if (mm < 10) "0" else "") + mm + " " + ap
              }

              private fun timeChip(key: String, def: Int): TextView {
                  val m = Prefs.int(this, key, def)
                  return chip(fmt(m), false) {
                      TimePickerDialog(this, { _, h, mm ->
                          Prefs.setInt(this, key, h * 60 + mm)
                          build()
                      }, m / 60, m % 60, false).show()
                  }
              }

              // Presets. Roman Urdu uses the English voice with Roman Urdu spelling rules.
              private fun pickLang() {
                  val presets = linkedMapOf(
                      "ur-PK" to "Urdu",
                      "en-IN" to "English (India)",
                      "roman" to "Roman Urdu (English voice + Roman Urdu spelling)"
                  )
                  AlertDialog.Builder(this).setTitle("Bhasha chunein")
                      .setItems(presets.values.toTypedArray()) { _, i ->
                          val key = presets.keys.elementAt(i)
                          if (key == "roman") {
                              Prefs.setStr(this, "tts_lang", "en-IN")
                              Prefs.setStr(this, "pron", "JWN=jaan; JAN=jaan; Ji=jee; Dock=Dhok")
                          } else {
                              Prefs.setStr(this, "tts_lang", key)
                          }
                          restartAssistant()
                          build()
                      }.show()
              }

              private fun pickEngine() {
                  val probe = TextToSpeech(this, null)
                  val engines = probe.engines
                  probe.shutdown()
                  val labels = (listOf("Default (phone ka)") + engines.map { it.label }).toTypedArray()
                  val ids = listOf("") + engines.map { it.name }
                  AlertDialog.Builder(this).setTitle("TTS engine chunein")
                      .setItems(labels) { _, i ->
                          Prefs.setStr(this, "tts_engine", ids[i])
                          Prefs.setStr(this, "tts_voice", "")
                          restartAssistant()
                          build()
                      }.show()
              }

              private fun pickVoice() {
                  val engine = Prefs.str(this, "tts_engine", "")
                  var probe: TextToSpeech? = null
                  val listener = TextToSpeech.OnInitListener { status ->
                      val t = probe ?: return@OnInitListener
                      val voices = if (status == TextToSpeech.SUCCESS) t.voices?.sortedBy { it.name }.orEmpty() else emptyList()
                      t.shutdown()
                      if (voices.isEmpty()) {
                          Toast.makeText(this, "Is engine mein koi voice nahi mili", Toast.LENGTH_LONG).show()
                          return@OnInitListener
                      }
                      val labels = (listOf("Default (calm female)") + voices.map { it.name + "  (" + it.locale + ")" }).toTypedArray()
                      val names = listOf("") + voices.map { it.name }
                      AlertDialog.Builder(this).setTitle("Awaz chunein")
                          .setItems(labels) { _, i ->
                              Prefs.setStr(this, "tts_voice", names[i])
                              build()
                          }.show()
                  }
                  probe = if (engine.isEmpty()) TextToSpeech(this, listener) else TextToSpeech(this, listener, engine)
              }

              private fun testVoice() {
                  val engine = Prefs.str(this, "tts_engine", "")
                  var probe: TextToSpeech? = null
                  val listener = TextToSpeech.OnInitListener { status ->
                      val t = probe ?: return@OnInitListener
                      if (status == TextToSpeech.SUCCESS) {
                          Prefs.applyVoice(this, t)
                          t.speak("Ji, main " + Prefs.name(this) + " hoon. Kaisi lagi meri awaz?", TextToSpeech.QUEUE_FLUSH, null, "test")
                          window.decorView.postDelayed({ t.shutdown() }, 6000)
                      } else t.shutdown()
                  }
                  probe = if (engine.isEmpty()) TextToSpeech(this, listener) else TextToSpeech(this, listener, engine)
              }

              private fun restartAssistant() {
                  if (AssistantService.instance != null) {
                      stopService(Intent(this, AssistantService::class.java))
                      window.decorView.postDelayed({
                          startForegroundService(Intent(this, AssistantService::class.java))
                      }, 800)
                  }
              }

              // True when the app is allowed to show notifications (needed for reply-failure alerts).
              private fun alertsOn() =
                  androidx.core.app.NotificationManagerCompat.from(this).areNotificationsEnabled()

              private fun testAlert() {
                  val n = Notification.Builder(this, "dock_alerts")
                      .setContentTitle("Test alert")
                      .setContentText("Ye test notification hai. Aisa alert tab aayega jab reply nahi jayega.")
                      .setSmallIcon(android.R.drawable.stat_notify_error)
                      .setAutoCancel(true)
                      .build()
                  getSystemService(NotificationManager::class.java).notify(999, n)
                  if (Prefs.bool(this, "alerts_voice", true)) {
                      speakOnce(Assistant.say(this, "fx_alert").replace("{sender}", "Test"))
                  }
              }

              // Speaks one line with the saved voice, then releases the TTS engine.
              private fun speakOnce(msg: String) {
                  var probe: TextToSpeech? = null
                  val listener = TextToSpeech.OnInitListener { status ->
                      val t = probe ?: return@OnInitListener
                      if (status == TextToSpeech.SUCCESS) {
                          Prefs.applyVoice(this, t)
                          t.speak(msg, TextToSpeech.QUEUE_FLUSH, null, "alert_test")
                          window.decorView.postDelayed({ t.shutdown() }, 8000)
                      } else t.shutdown()
                  }
                  val engine = Prefs.str(this, "tts_engine", "")
                  probe = if (engine.isEmpty()) TextToSpeech(this, listener) else TextToSpeech(this, listener, engine)
              }

              private fun build() {
                  val on = AssistantService.instance != null
                  pulse?.cancel()
                  pulse = null
                  animateCards = !introPlayed
                  introPlayed = true
                  cardIdx = 0
                  val name = Prefs.name(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(36), dp(16), dp(32))
                  }
                  root.addView(label(name, 32f, TXT, true))
                  root.addView(label("Aapka voice busy-reply assistant", 14f, MUTED))

                  val power = TextView(this).apply {
                      text = if (on) "ON" else "OFF"
                      textSize = 30f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      val c1 = if (on) ACC else Color.parseColor("#2A3050")
                      val c2 = if (on) ACC2 else Color.parseColor("#1F2440")
                      background = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(c1, c2)).apply {
                          shape = GradientDrawable.OVAL
                          setStroke(dp(4), if (on) ACC2 else Color.parseColor("#39406A"))
                      }
                      layoutParams = LinearLayout.LayoutParams(dp(150), dp(150)).apply {
                          gravity = Gravity.CENTER_HORIZONTAL
                          topMargin = dp(22)
                          bottomMargin = dp(10)
                      }
                      setOnClickListener { toggle() }
                  }
                  power.elevation = dp(10).toFloat()
                  power.cameraDistance = 12000f * resources.displayMetrics.density
