          package com.dock.app

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class MessageListener : NotificationListenerService() {
              private val seen = LinkedHashSet<String>()
              private val packages = setOf(
                  "com.whatsapp", "com.whatsapp.w4b",
                  "com.google.android.apps.messaging", "com.samsung.android.messaging",
                  "com.android.mms", "com.android.messaging"
              )

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val svc = AssistantService.instance ?: return
                  if (sbn.packageName !in packages) return
                  val n = sbn.notification
                  if (n.flags and Notification.FLAG_GROUP_SUMMARY != 0) return
                  val ex = n.extras
                  val title = ex.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: return
                  val text = ex.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: return
                  if (title == "WhatsApp" || Regex("\\d+ (new )?messages").containsMatchIn(text)) return

                  val isGroup = ex.getBoolean(Notification.EXTRA_IS_GROUP_CONVERSATION) ||
                      ex.getCharSequence(Notification.EXTRA_CONVERSATION_TITLE) != null
                  if (Prefs.bool(this, "nogroups", true) && isGroup) return

                  val only = Prefs.str(this, "contacts", "").split(",")
                      .map { it.trim().lowercase() }.filter { it.isNotEmpty() }
                  if (only.isNotEmpty() && only.none { title.lowercase().contains(it) }) return

                  if (svc.isOwn(text)) return
                  if (!seen.add(sbn.key + "|" + text)) return
                  if (seen.size > 100) seen.remove(seen.first())

                  var action: Notification.Action? =
                      n.actions?.firstOrNull { it.remoteInputs?.isNotEmpty() == true }
                  if (action == null) {
                      action = Notification.WearableExtender(n).actions
                          .firstOrNull { it.remoteInputs?.isNotEmpty() == true }
                  }
                  val a = action ?: return
                  svc.enqueue(Pending(title, text, a.remoteInputs, a.actionIntent, sbn.packageName))
              }
          }
          DOCK_EOF
          cat > app/src/main/java/com/dock/app/AssistantService.kt <<'DOCK_EOF'
          package com.dock.app

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.RemoteInput
          import android.app.Service
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.ContactsContract
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.telephony.SmsManager
          import android.telephony.SubscriptionManager
          import java.util.Calendar
          import java.util.Locale

          class Pending(
              val sender: String,
              val text: String,
              val inputs: Array<RemoteInput>,
              val intent: PendingIntent,
              val pkg: String
          )

          class AssistantService : Service(), TextToSpeech.OnInitListener {
              private lateinit var tts: TextToSpeech
              private var ttsReady = false
              private val handler = Handler(Looper.getMainLooper())
              private val queue = ArrayDeque<Pending>()
              private var working = false
              private var current: Pending? = null
              private var recognizer: SpeechRecognizer? = null
              private var deadline = 0L
              private var readOnly = false
              private val lastReply = HashMap<String, Long>()
              private val sent = ArrayList<String>()
              private var failId = 100
              private var failWhy = ""

              private val keys = listOf(
                  "busy" to listOf("busy", "bizzy", "mashroof", "مصروف"),
                  "game" to listOf("game", "gaming", "گیم"),
                  "driving" to listOf("driving", "drive", "ڈرائیو"),
                  "meeting" to listOf("meeting", "میٹنگ"),
                  "sleeping" to listOf("sleep", "sleeping", "نیند", "سو رہا"),
                  "namaz" to listOf("namaz", "prayer", "نماز")
              )

              // Say "shut up" to silence Fatima. Say "ok sorry" to bring her back.
              // Words are set in the app, separated by commas.
              private fun muteWords() = Prefs.str(this, "mute_words", "shut up, shutup, chup raho, chup ho ja")
                  .split(",").map { it.trim().lowercase() }.filter { it.isNotEmpty() }
              private fun unmuteWords() = Prefs.str(this, "unmute_words", "ok sorry, okay sorry, ok sori, okay sori, ok sari")
                  .split(",").map { it.trim().lowercase() }.filter { it.isNotEmpty() }

              // Wake words follow the assistant's saved name. "Fatima" also accepts common spellings.
              private fun wakeWords(): List<String> {
                  val custom = Prefs.str(this, "wake", "").trim().lowercase()
                  if (custom.isNotEmpty()) return listOf(custom)
                  val n = Prefs.name(this).lowercase()
                  return if (n == "fatima") listOf("fatima", "fatma", "fatema", "فاطمہ") else listOf(n)
              }

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("dock", "Dock", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, "dock")
                      .setContentTitle(Prefs.name(this) + " chal raha hai")
                      .setContentText("Messages ka intezar hai")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 30) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
                  val engine = Prefs.str(this, "tts_engine", "")
                  tts = if (engine.isEmpty()) TextToSpeech(this, this) else TextToSpeech(this, this, engine)
              }

              override fun onInit(status: Int) {
                  ttsReady = status == TextToSpeech.SUCCESS
                  if (!ttsReady) return
                  Prefs.applyVoice(this, tts)
                  // Default calm, soft female voice, used only until the user picks one.
                  if (Prefs.str(this, "tts_voice", "").isEmpty()) {
                      tts.voices?.firstOrNull {
                          it.name.contains("female", true) && !it.isNetworkConnectionRequired && it.locale.language == "en"
                      }?.let { tts.voice = it }
                  }
                  tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) {}
                      override fun onDone(id: String?) { handler.post { spoken(id) } }
                      @Deprecated("Deprecated in Java")
                      override fun onError(id: String?) { handler.post { spoken(id) } }
                  })
                  handler.post { next() }
              }

              fun isOwn(t: String): Boolean = sent.any { t.contains(it) }

              fun enqueue(p: Pending) {
                  handler.post { queue.addLast(p); next() }
              }

              private fun inQuiet(): Boolean {
                  if (!Prefs.bool(this, "quiet", false)) return false
                  val c = Calendar.getInstance()
                  val now = c.get(Calendar.HOUR_OF_DAY) * 60 + c.get(Calendar.MINUTE)
                  val s = Prefs.int(this, "qs", 23 * 60)
                  val e = Prefs.int(this, "qe", 7 * 60)
                  return if (s <= e) (now >= s && now < e) else (now >= s || now < e)
              }

              private fun next() {
                  if (working || !ttsReady) return
                  val p = queue.removeFirstOrNull() ?: run { idle(); return }
                  working = true
                  current = p
                  readOnly = false
                  val recent = System.currentTimeMillis() - (lastReply[p.sender] ?: 0L) < 10 * 60 * 1000L
                  if (inQuiet()) {
                      if (recent) skip(p) else autoReply(p, Prefs.reply(this, "sleeping"), "Quiet hours")
                  } else if (Prefs.bool(this, "game", false)) {
                      if (recent) skip(p) else autoReply(p, Prefs.reply(this, "game"), "Game mode")
                  } else {
                      readOnly = recent || Prefs.bool(this, "muted", false)
                      say(p.sender + " ka message aaya hai. " + p.text, "msg")
                  }
              }

              private fun skip(p: Pending) {
                  Prefs.addLog(this, p.sender + "  -  dobara reply nahi bheja")
                  finish()
              }

              private fun autoReply(p: Pending, text: String, tag: String) {
                  if (sendReply(p, text, tag)) finish() else failed(p)
              }

              private fun say(t: String, id: String) {
                  if (Prefs.bool(this, "muted", false)) { handler.post { spoken(id) }; return }
                  Prefs.applyVoice(this, tts)
                  tts.speak(applyPron(t), TextToSpeech.QUEUE_FLUSH, null, id)
              }

              // Pronunciation list from the app, written as "word=how to say it; word2=...".
              // Whole words only, one pass: "JWN" and "JAN" can both be set to "jaan" without affecting each other.
              private fun applyPron(t: String): String {
                  val map = HashMap<String, String>()
                  Prefs.str(this, "pron", "").split(";").forEach { pair ->
                      val kv = pair.split("=", limit = 2)
                      if (kv.size == 2 && kv[0].trim().isNotEmpty()) map[kv[0].trim().lowercase()] = kv[1].trim()
                  }
                  if (map.isEmpty()) return t
                  val pattern = map.keys.sortedByDescending { it.length }
                      .joinToString("|") { Regex.escape(it) }
                  return Regex("\\b(" + pattern + ")\\b", RegexOption.IGNORE_CASE).replace(t) { m ->
                      map[m.value.lowercase()] ?: m.value
                  }
              }

              private fun spoken(id: String?) {
                  if (id == "fx" || id == "alert") { finish(); return }
                  val p = current ?: return
                  if (id == "msg") {
                      if (readOnly) { finish(); return }
                      handler.postDelayed({
                          if (!SpeechRecognizer.isRecognitionAvailable(this)) finish()
                          else {
                              deadline = System.currentTimeMillis() + 60000
                              listen(p)
                          }
                      }, 400)
                  } else if (id == "ack") {
                      finish()
                  }
              }

              private fun listen(p: Pending) {
                  recognizer?.destroy()
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(res: Bundle?) {
                          val list = res?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION) ?: arrayListOf()
                          heard(p, list)
                      }
                      override fun onError(e: Int) { retryOrFinish(p) }
                      override fun onReadyForSpeech(b: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(b: Bundle?) {}
                      override fun onEvent(t: Int, b: Bundle?) {}
                  })
                  val lang = if (Prefs.bool(this, "urdu", false)) "ur-PK" else "en-IN"
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang)
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                      putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 2500L)
                  }
                  r.startListening(i)
              }

              private fun retryOrFinish(p: Pending) {
                  if (System.currentTimeMillis() < deadline - 3000) {
                      handler.postDelayed({ if (current === p) listen(p) }, 300)
                  } else finish()
              }

              private fun heard(p: Pending, results: List<String>) {
                  val first = (results.firstOrNull() ?: "").trim()
                  if (first.isEmpty()) { retryOrFinish(p); return }
                  var said = first
                  if (said.lowercase().startsWith("reply")) {
                      said = said.substring(5).trim().trimStart(':', ',', '-').trim()
                  }
                  if (said.isEmpty()) { retryOrFinish(p); return }
                  var reply = said
                  var tag = "Voice"
                  if (said.split(" ").size <= 3) {
                      val low = said.lowercase()
                      for ((k, words) in keys) {
                          if (words.any { it in low }) {
                              reply = Prefs.reply(this, k)
                              tag = Prefs.labels[k] ?: k
                              break
                          }
                      }
                  }
                  if (sendReply(p, reply, tag)) say("Reply bhej diya", "ack") else failed(p)
              }

              private fun sendReply(p: Pending, text: String, tag: String): Boolean {
                  val needsSim = isSms(p) && Prefs.int(this, "sim", 0) != 0
                  if (needsSim && (checkSelfPermission(Manifest.permission.SEND_SMS) != PackageManager.PERMISSION_GRANTED ||
                          checkSelfPermission(Manifest.permission.READ_PHONE_STATE) != PackageManager.PERMISSION_GRANTED)) {
                      failWhy = "SMS ya Phone permission nahi hai. App kholkar permission dein."
                      return false
                  }
                  val intent = Intent()
                  val bundle = Bundle()
                  for (ri in p.inputs) bundle.putCharSequence(ri.resultKey, text)
                  RemoteInput.addResultsToIntent(p.inputs, intent, bundle)
                  return try {
                      if (!(isSms(p) && sendSmsViaSim(p, text))) p.intent.send(this, 0, intent)
                      lastReply[p.sender] = System.currentTimeMillis()
                      sent.add(text)
                      if (sent.size > 20) sent.removeAt(0)
                      Prefs.setInt(this, "count", Prefs.int(this, "count", 0) + 1)
                      Prefs.addLog(this, p.sender + "  >  " + tag + ": " + text)
                      true
                  } catch (e: Exception) {
                      failWhy = "Reply bhejne mein masla aaya. Message ka reply dobara karein."
                      false
                  }
              }

              // Runs after a failed reply: logs it, shows the silent alert, then speaks the voice alert.
              private fun failed(p: Pending) {
                  notifyFail(p, failWhy)
                  if (Prefs.bool(this, "alerts_voice", true) && ttsReady) {
                      say(Assistant.say(this, "fx_alert").replace("{sender}", p.sender), "alert")
                  } else finish()
              }

              // Logs every failed reply. Shows a silent alert only when the user has it switched on.
              private fun notifyFail(p: Pending, why: String) {
                  Prefs.addLog(this, p.sender + "  x  reply fail: " + why)
                  if (!Prefs.bool(this, "alerts", true)) return
                  Prefs.createAlertChannel(this)
                  val nm = getSystemService(NotificationManager::class.java)
                  val n = Notification.Builder(this, "dock_alerts")
                      .setContentTitle("Reply nahi gaya: " + p.sender)
                      .setContentText(why)
                      .setStyle(Notification.BigTextStyle().bigText(why + "\n\nMessage: " + p.text))
                      .setSmallIcon(android.R.drawable.stat_notify_error)
                      .setVisibility(Notification.VISIBILITY_PRIVATE)
                      .setOnlyAlertOnce(true)
                      .setAutoCancel(true)
                      .build()
                  nm.notify(failId++, n)
              }

              private fun isSms(p: Pending) = !p.pkg.startsWith("com.whatsapp")

              private fun sendSmsViaSim(p: Pending, text: String): Boolean {
                  val pref = Prefs.int(this, "sim", 0)
                  if (pref == 0) return false
                  if (checkSelfPermission(Manifest.permission.SEND_SMS) != PackageManager.PERMISSION_GRANTED) return false
                  if (checkSelfPermission(Manifest.permission.READ_PHONE_STATE) != PackageManager.PERMISSION_GRANTED) return false
                  val number = findNumber(p.sender) ?: return false
                  return try {
                      val subs = getSystemService(SubscriptionManager::class.java).activeSubscriptionInfoList
                          ?: return false
                      val sub = subs.firstOrNull { it.simSlotIndex == pref - 1 } ?: return false
                      val mgr = SmsManager.getSmsManagerForSubscriptionId(sub.subscriptionId)
                      mgr.sendMultipartTextMessage(number, null, mgr.divideMessage(text), null, null)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun findNumber(name: String): String? {
                  val digits = name.replace(Regex("[\\s\\-()]"), "")
                  if (Regex("\\+?\\d{6,15}").matches(digits)) return digits
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) return null
                  return try {
                      contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(ContactsContract.CommonDataKinds.Phone.NUMBER),
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " = ?",
                          arrayOf(name), null
                      )?.use { c -> if (c.moveToFirst()) c.getString(0) else null }
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun idle() {
                  if (working || !ttsReady || !Prefs.bool(this, "fx_on", true)) return
                  working = true
                  wake()
              }

              private fun wake() {
                  recognizer?.destroy()
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(res: Bundle?) {
                          val text = (res?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: "").lowercase()
                          if (unmuteWords().any { text.contains(it) }) {
                              Prefs.setBool(this@AssistantService, "muted", false)
                              say(Assistant.say(this@AssistantService, "fx_unmute"), "fx")
                              return
                          }
                          if (Prefs.bool(this@AssistantService, "muted", false)) { finish(); return }
                          if (muteWords().any { text.contains(it) }) {
                              // Speak the reply first, then mute. The flow continues after it finishes speaking.
                              say(Assistant.say(this@AssistantService, "fx_mute"), "fx")
                              Prefs.setBool(this@AssistantService, "muted", true)
                              return
                          }
                          val hit = wakeWords().firstOrNull { text.contains(it) }
                          if (hit == null) finish()
                          else say(Assistant.answer(this@AssistantService, text.substringAfter(hit).trim()), "fx")
                      }
                      override fun onError(e: Int) { handler.postDelayed({ finish() }, 500) }
                      override fun onReadyForSpeech(b: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(b: Bundle?) {}
                      override fun onEvent(t: Int, b: Bundle?) {}
                  })
                  r.startListening(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-IN")
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                  })
              }

              private fun finish() {
                  recognizer?.destroy()
                  recognizer = null
                  current = null
                  working = false
                  next()
              }

              override fun onStartCommand(i: Intent?, f: Int, s: Int) = START_STICKY
              override fun onBind(i: Intent?): IBinder? = null

              override fun onDestroy() {
                  instance = null
                  recognizer?.destroy()
                  if (ttsReady) tts.shutdown()
                  super.onDestroy()
              }

              companion object {
                  @Volatile var instance: AssistantService? = null
              }
          }
          DOCK_EOF
          cat > app/src/main/java/com/dock/app/Prefs.kt <<'DOCK_EOF'
          package com.dock.app

          import android.content.Context
          import android.speech.tts.TextToSpeech
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object Prefs {
              val defaults = linkedMapOf(
                  "busy" to "Abhi main busy hoon, baad mein baat karta hoon.",
                  "game" to "Main game khel raha hoon, baad mein baat karta hoon.",
                  "driving" to "Main drive kar raha hoon, baad mein baat karta hoon.",
                  "meeting" to "Main meeting mein hoon, baad mein baat karta hoon.",
                  "sleeping" to "Main so raha hoon, subah baat karta hoon.",
                  "namaz" to "Main namaz parh raha hoon, baad mein baat karta hoon."
              )
              val labels = linkedMapOf(
                  "busy" to "Busy", "game" to "Game", "driving" to "Driving",
                  "meeting" to "Meeting", "sleeping" to "Sleeping / Quiet hours", "namaz" to "Namaz"
              )

              private fun sp(c: Context) = c.getSharedPreferences("dock", Context.MODE_PRIVATE)
              fun bool(c: Context, k: String, d: Boolean) = sp(c).getBoolean(k, d)
              fun setBool(c: Context, k: String, v: Boolean) = sp(c).edit().putBoolean(k, v).apply()
              fun str(c: Context, k: String, d: String): String = sp(c).getString(k, d) ?: d
              fun setStr(c: Context, k: String, v: String) = sp(c).edit().putString(k, v).apply()
              fun int(c: Context, k: String, d: Int) = sp(c).getInt(k, d)
              fun setInt(c: Context, k: String, v: Int) = sp(c).edit().putInt(k, v).apply()
              fun reply(c: Context, k: String): String = str(c, "r_" + k, defaults[k] ?: "")

              // Assistant's name, set by the user in the app. Defaults to Fatima.
              fun name(c: Context): String = str(c, "aname", "Fatima").trim().ifEmpty { "Fatima" }

              // Applies saved pitch and speed (stored x100, 92 = 0.92) and the chosen voice, if any.
              fun applyVoice(c: Context, t: TextToSpeech) {
                  t.language = Locale.forLanguageTag(str(c, "tts_lang", "en-IN"))
                  t.setPitch(int(c, "pitch", 92) / 100f)
                  t.setSpeechRate(int(c, "rate", 85) / 100f)
                  val vn = str(c, "tts_voice", "")
                  if (vn.isNotEmpty()) t.voices?.firstOrNull { it.name == vn }?.let { t.voice = it }
              }

              // Silent "Dock alerts" channel. The old channel is removed so the new silent settings apply.
              fun createAlertChannel(c: Context) {
                  val nm = c.getSystemService(android.app.NotificationManager::class.java)
                  nm.deleteNotificationChannel("dock_alert")
                  val ch = android.app.NotificationChannel(
                      "dock_alerts", "Dock alerts", android.app.NotificationManager.IMPORTANCE_LOW
                  )
                  ch.description = "Reply na jaye to chupchaap alert"
                  ch.setSound(null, null)
                  ch.enableVibration(false)
                  nm.createNotificationChannel(ch)
              }

              // Restores the assistant's voice, name, wake word, language, pronunciation and texts to defaults.
              fun resetAssistant(c: Context) {
                  val e = sp(c).edit()
                  listOf("pitch", "rate", "tts_voice", "tts_engine", "tts_lang", "aname", "wake", "pron", "owner", "mute_words", "unmute_words")
                      .forEach { e.remove(it) }
                  defaults.keys.forEach { e.remove("r_" + it) }
                  Assistant.defaults.keys.forEach { e.remove(it) }
                  e.apply()
              }

              fun log(c: Context): List<String> = str(c, "log", "").split("\n").filter { it.isNotBlank() }

              fun addLog(c: Context, line: String) {
                  val t = SimpleDateFormat("dd MMM, hh:mm a", Locale.getDefault()).format(Date())
                  val all = (listOf(t + "  |  " + line.replace("\n", " ")) + log(c)).take(40)
                  setStr(c, "log", all.joinToString("\n"))
              }
          }
          DOCK_EOF
          cat > app/src/main/java/com/dock/app/Assistant.kt <<'DOCK_EOF'
          package com.dock.app

          import android.content.Context
          import java.util.Calendar

          object Assistant {
              val defaults = linkedMapOf(
                  "fx_greet" to "Ji {owner}? Kya ho gaya meri jaan? Main yahan hoon.",
                  "fx_time" to "Abhi {time} hain, {owner}.",
                  "fx_thanks" to "Koi baat nahi, {owner}. Hamesha haazir hoon.",
                  "fx_name" to "Mera naam {name} hai. Main aapki Jaan hoon.",
                  "fx_game_on" to "Theek hai {owner}, game mode on kar diya.",
                  "fx_game_off" to "Theek hai {owner}, game mode band kar diya.",
                  "fx_default" to "Ji {owner}, boliye. Main sun rahi hoon.",
                  "fx_alert" to "{owner}, {sender} ko reply nahi gaya. Dobara koshish karein.",
                  "fx_mute" to "Theek hai {owner}, main chup ho rahi hoon.",
                  "fx_unmute" to "Ji {owner}, main wapas aa gayi. Boliye."
              )

              fun say(c: Context, key: String, time: String = ""): String {
                  val owner = Prefs.str(c, "owner", "Hassan")
                  return Prefs.str(c, key, defaults[key] ?: "")
                      .replace("{owner}", owner)
                      .replace("{time}", time)
                      .replace("{name}", Prefs.name(c))
              }

              fun answer(c: Context, cmd: String): String {
                  val low = cmd.lowercase().trim()
                  return when {
                      low.isEmpty() -> say(c, "fx_greet")
                      low.contains("game on") -> { Prefs.setBool(c, "game", true); say(c, "fx_game_on") }
                      low.contains("game off") -> { Prefs.setBool(c, "game", false); say(c, "fx_game_off") }
                      low.contains("time") || low.contains("baje") -> say(c, "fx_time", clock())
                      low.contains("naam") || low.contains("name") -> say(c, "fx_name")
                      low.contains("shukriya") || low.contains("thank") -> say(c, "fx_thanks")
                      else -> say(c, "fx_default")
                  }
              }

              private fun clock(): String {
                  val now = Calendar.getInstance()
                  val h = now.get(Calendar.HOUR_OF_DAY)
                  val m = now.get(Calendar.MINUTE)
                  return "%d:%02d %s".format(if (h % 12 == 0) 12 else h % 12, m, if (h < 12) "AM" else "PM")
              }
          }
          DOCK_EOF
          cat > app/src/main/java/com/dock/app/BootReceiver.kt <<'DOCK_EOF'
          package com.dock.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  if (i.action != Intent.ACTION_BOOT_COMPLETED) return
                  if (!Prefs.bool(c, "autostart", true)) return
                  val nm = c.getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("dock_boot", "Dock shuru karein", NotificationManager.IMPORTANCE_HIGH)
                  )
                  val open = Intent(c, MainActivity::class.java)
                      .putExtra("autostart", true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val pi = PendingIntent.getActivity(
                      c, 0, open, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = Notification.Builder(c, "dock_boot")
                      .setContentTitle(Prefs.name(c) + " band hai")
                      .setContentText("Shuru karne ke liye yahan tap karein")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .build()
                  nm.notify(2, n)
              }
          }
